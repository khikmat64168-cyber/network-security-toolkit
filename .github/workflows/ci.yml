name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]   # releases run their own checks in release.yml
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: System libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpcap0.8
      - name: Install
        run: pip install -e '.[web]' -r requirements-dev.txt
      - name: flake8
        run: flake8 src
      - name: mypy
        run: mypy src
      - name: pytest
        run: pytest -q -p no:cacheprovider --cov=nst --cov-report=term

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --build-arg "VERSION=ci-${GITHUB_SHA::7}" -t nst:ci .
      - name: Smoke test (public mode answers on loopback)
        run: |
          docker run -d --name nst --network host \
            -e NST_ALLOWED_HOSTS=ci.example -e NST_WEB_PORT=8766 nst:ci
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8766/api/mode && exit 0
            sleep 1
          done
          docker logs nst
          exit 1

  scripts:
    name: Shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh deploy/*.sh
