# NST on the VPS: Caddy (HTTPS) + public demo + private console.
#
# Everything uses the host network so the backends can listen on loopback
# only — the same security model as `nst web` on a laptop.  Only Caddy
# listens on public ports (80/443).
#
# Settings come from deploy/.env (see .env.example).  The console's
# basic-auth line lives in secrets/console-auth.caddy, created by
# vps-setup.sh, never committed.

name: nst

x-backend: &backend
  image: ghcr.io/khikmat64168-cyber/network-security-toolkit:${NST_VERSION:?set NST_VERSION in .env}
  network_mode: host
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  caddy:
    image: caddy:2.8.4
    network_mode: host
    restart: unless-stopped
    environment:
      NST_PUBLIC_HOST: ${NST_PUBLIC_HOST:?set NST_PUBLIC_HOST in .env}
      NST_CONSOLE_HOST: ${NST_CONSOLE_HOST:?set NST_CONSOLE_HOST in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./secrets/console-auth.caddy:/etc/caddy/console-auth.caddy:ro
      - /srv/networkscan-front:/srv/networkscan-front:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      nst-public:
        condition: service_started

  nst-public:
    <<: *backend
    # Unprivileged: no capture, nothing stored.
    user: "10001:10001"
    cap_drop: [ALL]
    environment:
      NST_WEB_MODE: public
      NST_WEB_PORT: "8766"
      NST_ALLOWED_HOSTS: ${NST_PUBLIC_HOST}
    tmpfs:
      - /var/lib/nst:size=16m,uid=10001,gid=10001
      - /tmp:size=16m

  nst-console:
    <<: *backend
    # Root inside the container, but only the two capabilities packet
    # capture needs; everything else is dropped.
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN]
    environment:
      NST_WEB_MODE: console
      NST_WEB_PORT: "8765"
      NST_ALLOWED_HOSTS: ${NST_CONSOLE_HOST}
      NST_WEB_TOKEN: ${NST_WEB_TOKEN:?set NST_WEB_TOKEN in .env}
      # Root without CAP_DAC_OVERRIDE cannot write the image's nst-owned
      # /var/lib/nst, so the console keeps its state in its own volume.
      XDG_STATE_HOME: /var/lib/nst-console
    volumes:
      - nst-console-state:/var/lib/nst-console
    tmpfs:
      - /tmp:size=64m

volumes:
  caddy-data:
  caddy-config:
  nst-console-state:
