[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "network-security-toolkit"
dynamic = ["version"]
description = "Network security toolkit: packet sniffing, ARP/DNS/MAC attack detection, TLS inspection and HTML reports"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = [
    "network", "security", "packet-sniffer", "arp-spoofing", "dns-spoofing",
    "mac-flooding", "tls", "cybersecurity", "scapy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "scapy>=2.5.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "click>=8.1.7",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12.0",
]

[project.urls]
Homepage = "https://github.com/khikmat64168-cyber/network-security-toolkit"
Issues = "https://github.com/khikmat64168-cyber/network-security-toolkit/issues"

[project.scripts]
nst = "nst.cli.main:main"

[tool.setuptools.dynamic]
version = { attr = "nst.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["nst*"]

[tool.setuptools.package-data]
nst = ["config/*.yaml", "py.typed", "web/static/*", "web/static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    # Starlette's TestClient still works with httpx; silence its migration notice.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.black]
line-length = 100
target-version = ["py312"]
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["nst"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
